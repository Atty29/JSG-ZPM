name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Validate model and texture resources
        run: python3 tools/validate_ancient_assets.py

      - name: Check wall holder visual transforms
        run: |
          mkdir -p build/visual-checks
          javac -d build/visual-checks src/main/java/uk/co/atty29/jsgzpm/holder/ZPMHolderLayout.java src/main/java/uk/co/atty29/jsgzpm/holder/WallHolderGeometry.java tools/WallHolderGeometryCheck.java
          java -cp build/visual-checks WallHolderGeometryCheck

      - name: Check pedestal geometry
        run: |
          javac -d build/visual-checks src/main/java/uk/co/atty29/jsgzpm/holder/PedestalGeometry.java src/main/java/uk/co/atty29/jsgzpm/client/PedestalLightGeometry.java tools/PedestalGeometryCheck.java
          java -cp build/visual-checks PedestalGeometryCheck

      - name: Check recharger geometry and effects
        run: |
          javac -d build/visual-checks src/main/java/uk/co/atty29/jsgzpm/generator/RechargerGeometry.java src/main/java/uk/co/atty29/jsgzpm/client/RechargerMesh.java tools/RechargerGeometryCheck.java
          java -cp build/visual-checks RechargerGeometryCheck

      - name: Check DHD buttons and guidance
        run: |
          javac -d build/visual-checks src/main/java/uk/co/atty29/jsgzpm/holder/DHDGeometry.java tools/DHDGeometryCheck.java
          java -cp build/visual-checks DHDGeometryCheck

      - name: Build
        run: gradle build --stacktrace

      - name: Verify packaged model and texture resources
        run: python3 tools/validate_ancient_assets.py --jar --check-vanilla-atlas

      - name: Upload test JARs
        uses: actions/upload-artifact@v4
        with:
          name: jsg-zpm-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
