name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Validate model and texture resources
        run: python3 tools/validate_ancient_assets.py

      - name: Build
        run: gradle build --stacktrace

      - name: Verify packaged model and texture resources
        run: python3 tools/validate_ancient_assets.py --jar

      - name: Upload test JARs
        uses: actions/upload-artifact@v4
        with:
          name: jsg-zpm-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
